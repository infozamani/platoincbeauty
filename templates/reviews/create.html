{% extends 'base.html' %}

{% block title %}Leave a Review - PlatonicBeauty{% endblock %}

{% block content %}
<section class="py-16">
    <div class="container mx-auto px-4 max-w-xl">
        <h1 class="font-serif text-4xl font-bold mb-8 text-center">Leave a Review</h1>

        <form method="post" class="bg-white p-8 rounded-lg shadow-lg space-y-4">
            {% csrf_token %}
            <div>
                <label class="block font-semibold mb-2">Stylist</label>
                <select name="stylist" required class="w-full px-4 py-3 border rounded-lg">
                    <option value="">-- Choose a stylist --</option>
                    {% for s in stylists %}
                        <option value="{{ s.id }}">{{ s.display_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block font-semibold mb-2">Your Name</label>
                <input type="text" name="name" required class="w-full px-4 py-3 border rounded-lg">
            </div>

            <div>
                <label class="block font-semibold mb-2">Rating (1-5)</label>
                <select name="rating" required class="w-full px-4 py-3 border rounded-lg">
                    <option value="5">★★★★★ (5)</option>
                    <option value="4">★★★★ (4)</option>
                    <option value="3">★★★ (3)</option>
                    <option value="2">★★ (2)</option>
                    <option value="1">★ (1)</option>
                </select>
            </div>

            <div>
                <label class="block font-semibold mb-2">Comment</label>
                <textarea name="comment" rows="4" class="w-full px-4 py-3 border rounded-lg"></textarea>
            </div>

            <button type="submit" class="w-full bg-beauty-pink text-white py-3 rounded-full font-semibold">
                Submit Review
            </button>
        </form>
    </div>
</section>
{% endblock %}
